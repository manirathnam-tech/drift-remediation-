name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt, validate, and TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: terraform-linters/setup-tflint@v6.3.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Terraform injector artifacts
        run: bash infra/injector/package.sh
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize and validate Terraform configurations
        shell: bash
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra infra/platform; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            pushd "$dir"
            tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --init
            tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=warning
            popd
          done

  python:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            harness/requirements.txt
            infra/injector/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r harness/requirements.txt -r infra/injector/requirements.txt
      - name: Lint Python
        run: ruff check harness infra/injector/src
      - name: Run tests
        run: python -m pytest -q infra/injector/src/test_injector.py

  publish-injector:
    name: Build and publish injector image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [terraform, python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable commit tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image="$account_id.dkr.ecr.ap-southeast-2.amazonaws.com/drift-thesis-injector:$IMAGE_TAG"
          docker build --file infra/injector/Dockerfile --tag "$image" .
          docker push "$image"
