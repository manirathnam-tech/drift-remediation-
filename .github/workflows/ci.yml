name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt, validate, and TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: terraform-linters/setup-tflint@v6.3.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Terraform injector artifacts
        run: bash infra/injector/package.sh
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize and validate Terraform configurations
        shell: bash
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra infra/platform; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            pushd "$dir"
            tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --init
            tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=warning
            popd
          done

  python:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            harness/requirements.txt
            infra/injector/requirements.txt
            infra/orchestrator/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r harness/requirements.txt -r infra/injector/requirements.txt -r infra/orchestrator/requirements.txt
      - name: Lint Python
        run: ruff check harness experiments infra/injector/src infra/collector/src infra/orchestrator/src infra/validator/src infra/baseline/src
      - name: Check baseline worker syntax
        run: python -m py_compile infra/baseline/src/*.py
      - name: Run tests
        run: python -m pytest -q infra/injector/src/test_injector.py infra/orchestrator/src/test_treatment_boundaries.py infra/validator/src/test_validation_reports.py infra/baseline/src/test_rules.py experiments
      - name: Check retrieval corpus split identities
        run: python experiments/check_knowledge_leakage.py

  policies:
    name: Treatment image and policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build treatment image
        run: docker build --file infra/orchestrator/Dockerfile --tag drift-treatment:local .
      - name: Verify policy tests without network access
        run: make policy-test
      - name: Reject known-bad inputs with installed static validators
        run: docker run --rm --network none --entrypoint python drift-treatment:local /app/validator/src/smoke_validation.py
