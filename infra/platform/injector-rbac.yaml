apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-injector
  namespace: online-boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-injector
  namespace: online-boutique
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["frontend", "cartservice", "currencyservice"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["frontend-external", "cartservice", "productcatalogservice"]
    verbs: ["get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["drift-observer"]
    verbs: ["get", "patch", "escalate", "bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["drift-observer"]
    verbs: ["get", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames:
      - "allow-callers-to-productcatalogservice"
      - "allow-cartservice-to-redis-cart"
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-injector
  namespace: online-boutique
subjects:
  - kind: ServiceAccount
    name: drift-injector
    namespace: online-boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drift-injector
