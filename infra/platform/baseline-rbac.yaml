apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-baseline-application-sync
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["online-boutique"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-baseline-application-sync
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: drift-baseline
    namespace: argocd
roleRef:
  kind: Role
  name: drift-baseline-application-sync
  apiGroup: rbac.authorization.k8s.io
